services:
  postgres:
    image: postgres:16-alpine
    container_name: monitor_licitacoes_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: monitor_licitacoes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitor_licitacoes"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: monitor_licitacoes_api
    restart: always
    ports:
      - "3334:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/monitor_licitacoes?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "super-secret-refresh-key-change-in-production"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:3001"
      CRON_SCHEDULE: "0 */2 * * *"
      PNCP_API_BASE_URL: "https://pncp.gov.br/api/consulta/v1"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate --schema=./prisma/schema.prisma && npx prisma db push --schema=./prisma/schema.prisma && npx prisma db seed && npm run dev"

  prisma-studio:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: monitor_licitacoes_prisma_studio
    restart: always
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/monitor_licitacoes?schema=public"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio --schema=./prisma/schema.prisma --port 5555 --browser none

volumes:
  postgres_data: